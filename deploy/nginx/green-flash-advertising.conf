server {
    listen 80;
    listen [::]:80;
    server_name greenflashads.com www.greenflashads.com;

    root /var/www/green-flash-advertising;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    # Hashed, immutable build assets — cache forever
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Other static files (images, fonts, favicon) served from /public
    location ~* \.(?:woff2?|ttf|otf|ico|svg|jpg|jpeg|png|gif|webp)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    # SPA fallback: unknown paths (e.g. /privacy, /terms) resolve client-side via React Router
    location / {
        try_files $uri /index.html;
    }

    # Never cache the HTML shell, so deploys show up immediately
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
