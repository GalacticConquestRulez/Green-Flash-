# links.greenflashusa.com — the standalone links page.
#
# This is a single self-contained index.html (all artwork inlined as data URIs)
# plus the backdrop video and the four client screenshots. It shares nothing
# with the main site's build, so it gets its own root and its own server block.
#
# Install with deploy/patch-links-nginx.sh, NOT by copying this over a live
# conf: once certbot has run it rewrites the live file in place, and copying
# over it destroys the SSL config.
server {
    listen 80;
    listen [::]:80;
    server_name links.greenflashusa.com;

    root /var/www/gfa-links;
    index index.html;

    # The page is ~500KB of base64, which is text — gzip pays for itself here.
    # nginx always gzips text/html regardless of gzip_types, and video/mp4 is
    # deliberately absent so range requests stay byte-exact.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Client screenshots and the logo: stable files, safe to cache.
    location ~* \.(?:jpg|jpeg|png|webp|svg|ico)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    # The backdrop video. Safari will not start playback without range
    # requests; nginx serves those by default, so the only job here is to keep
    # it uncompressed and cached hard.
    location ~* \.(?:mp4|webm)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ =404;

        # nginx does NOT inherit server-level add_header into a block that sets
        # its own, so these are declared here rather than above — otherwise the
        # HTML, where they matter most, would be served without them.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # Never cache the HTML, so an edit is visible on the next reload.
        add_header Cache-Control "no-cache" always;
    }
}
