server {
    listen 80;
    listen [::]:80;
    server_name greenflashusa.com www.greenflashusa.com;

    root /var/www/greenflash;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    # Hashed, immutable build assets — cache forever
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Other static files (images, fonts, favicon) served from /public
    location ~* \.(?:woff2?|ttf|otf|ico|svg|jpg|jpeg|png|gif|webp)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Serve each route's prerendered HTML (/privacy -> /privacy/index.html).
    # Every real route is prerendered, so anything left is genuinely missing and
    # gets the prerendered 404 page with a true 404 status (not a soft 404).
    # NOTE: adding a route in App.tsx also means adding it to ROUTE_META, or it
    # will 404 here.
    location / {
        try_files $uri $uri/index.html =404;

        # Never cache HTML, so a deploy is visible immediately. nginx does NOT
        # inherit server-level add_header into a block that sets its own, so the
        # security headers above are repeated here — otherwise the HTML pages,
        # where they matter most, would lose them.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "no-cache" always;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
    }
}
