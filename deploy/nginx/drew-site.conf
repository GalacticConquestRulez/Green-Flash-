# Mendoza Marketing — the static site body, shared by every hostname that
# serves it. Source + build: /root/drew-src (deploy.sh). Repo copy of this
# file: deploy/nginx/drew-site.conf — edit there, then copy to
# /etc/nginx/snippets/ and include it from the server block. Taken from
# snippets/ephraim-site.conf (Open Air Gallery) with the root changed and the
# vCard location dropped: this site has no .vcf.
#
# NOT installed yet. Step 9 of the plan: gd-dns add drew, certbot, /var/www/drew.
root /var/www/drew;
index index.html;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

gzip on;
gzip_vary on;
gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
gzip_min_length 512;

error_page 404 /404.html;

location ~ /\. { deny all; return 404; }

# Canonical home URL
location = /index { return 301 /; }

# A trailing slash on a page is the same page: /work/ -> /work.
location ~ ^/([a-z0-9/-]+)/$ { return 301 /$1; }

location / {
    # Drop .html from *external* URLs only ($request_uri), so the internal
    # index.html / 404.html rewrites are not turned into redirects.
    if ($request_uri ~ ^/index\.html(\?|$)) { return 301 /; }
    if ($request_uri ~ ^/(.+)\.html(\?|$)) { return 301 /$1; }
    try_files $uri $uri.html $uri/ =404;
}

location ^~ /assets/ {
    add_header Cache-Control "public, max-age=2592000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    access_log off;
}
location ~* \.(css|js)$ {
    add_header Cache-Control "public, max-age=86400";
    add_header X-Content-Type-Options "nosniff" always;
}
location ~* \.(mp4|webm)$ {
    mp4;
    add_header Cache-Control "public, max-age=2592000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    access_log off;
}
